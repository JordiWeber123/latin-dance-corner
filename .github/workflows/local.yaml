name: Local CI/CD

on:
  push:
    branches: [main, luis, jordi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test backend
        working-directory: ./backend
        shell: pwsh
        run: make test
      - name: Build backend
        working-directory: ./backend
        shell: pwsh
        run: make build
      - name: Test frontend 
        working-directory: ./frontend
        shell: pwsh
        run: echo NO_TESTS
      - name: Build frontend
        working-directory: ./frontend
        shell: pwsh
        run: echo NO_BUILD_SCRIPT
