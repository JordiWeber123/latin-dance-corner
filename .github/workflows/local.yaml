name: Local CI/CD

on:
  push:
    branches: [main, luis, jordi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: make build
      - name: Test
        shell: pwsh
        run: make test