name: Main CI/CD

on:
  push:
    branches: [main, luis, jordi]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: ./backend
        shell: powershell
        run: make test
      - name: Build backend
        working-directory: ./backend
        shell: powershell
        run: make build
      - name: Test frontend 
        working-directory: ./frontend
        shell: powershell
        run: echo NO_TESTS
      - name: Build frontend
        working-directory: ./frontend
        shell: powershell
        run: echo NO_BUILD_SCRIPT
